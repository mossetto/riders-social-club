name: Deploy Frontend → Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          cd frontend/dist
          JS_FILE=$(ls assets/*.js)
          CSS_FILE=$(ls assets/*.css)
          JS_NAME=$(basename $JS_FILE)
          CSS_NAME=$(basename $CSS_FILE)

          echo "Subiendo index.html..."
          curl -s -T index.html "ftp://$FTP_HOST/index.html" -u "$FTP_USER:$FTP_PASS"

          echo "Subiendo $JS_NAME..."
          curl -s -T "assets/$JS_NAME" "ftp://$FTP_HOST/assets/$JS_NAME" -u "$FTP_USER:$FTP_PASS"

          echo "Subiendo $CSS_NAME..."
          curl -s -T "assets/$CSS_NAME" "ftp://$FTP_HOST/assets/$CSS_NAME" -u "$FTP_USER:$FTP_PASS"

          echo "Subiendo .htaccess..."
          curl -s -T .htaccess "ftp://$FTP_HOST/.htaccess" -u "$FTP_USER:$FTP_PASS"

          echo "Verificando live..."
          sleep 5
          curl -s "https://chocolate-crane-120838.hostingersite.com/" | grep -o 'assets/[^"]*'
